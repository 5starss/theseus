worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    resolver 127.0.0.11 valid=30s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream frontend_upstream {
        zone frontend_upstream 64k;
        server frontend:80 resolve;
        keepalive 32;
    }

    upstream api_gateway_upstream {
        zone api_gateway_upstream 64k;
        server api-gateway:8080 resolve;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name j14a503.p.ssafy.io;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name j14a503.p.ssafy.io;

        ssl_certificate /etc/letsencrypt/live/j14a503.p.ssafy.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/j14a503.p.ssafy.io/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location = /jenkins {
            return 301 /jenkins/;
        }

        location /jenkins/ {
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_request_buffering off;
            client_max_body_size 50M;

            proxy_pass http://jenkins:8080;
        }

        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://api_gateway_upstream;
        }

        location /api/v1/notifications/ {
            # 기존에 정의된 upstream 이름을 사용하세요
            proxy_pass http://api_gateway_upstream;

            proxy_http_version 1.1;

            # SSE는 Upgrade 헤더가 필요 없습니다.
            # 오히려 설정되어 있으면 브라우저가 연결을 오해할 수 있으니 비워줍니다.
            proxy_set_header Connection "";
            proxy_set_header Upgrade "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 필수 설정
            proxy_buffering off;
            proxy_cache off;
            # Spring Boot(백엔드)에 버퍼링하지 말라고 직접 신호를 보냅니다
            proxy_set_header X-Accel-Buffering no;

            # 연결 유지 시간 (5분 정도로도 충분하지만, 필요시 늘리세요)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # 스트리밍 활성화
            chunked_transfer_encoding on;
        }

        location /ws/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;

            proxy_pass http://api_gateway_upstream;
        }


        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://frontend_upstream;
        }
    }
}
