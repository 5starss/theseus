services:
  theseus-core-server:
    build:
      context: ../../../backend/theseus-core-server
      dockerfile: Dockerfile
    image: theseus-core-server:local
    container_name: theseus-local-core-server
    command: ["python", "-m", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8086", "--workers", "1"]
    group_add:
      - "${DOCKER_GID:-988}"
    env_file:
      - .env.local
    environment:
      AUTH_MODE: spring
      CORE_KAFKA_CONSUMER_ENABLED: true
      SANDBOX_STARTUP_CHECK: false
      DOCKER_HOST: unix:///var/run/docker.sock
      THESEUS_DATA_DIR: ${THESEUS_DATA_DIR:-/home/appuser/.theseus/data}
      SANDBOX_HOST_TEMP_ROOT: ${SANDBOX_HOST_TEMP_ROOT:-/tmp/theseus-sandbox-shared}
      SANDBOX_CONTAINER_TEMP_ROOT: ${SANDBOX_CONTAINER_TEMP_ROOT:-/tmp/theseus-sandbox-shared}
      CORE_POSTGRES_HOST: theseus-local-postgres
      CORE_POSTGRES_PORT: 5432
      CORE_POSTGRES_DSN: postgresql://root:root@theseus-local-postgres:5432/theseus_core
      SPRING_BOOT_INTERNAL_URL: http://theseus-api-server:8080
      SPRING_BOOT_AUTH_VERIFY_URL: http://theseus-api-server:8080/api/internal/auth/verify
      SPRING_BOOT_PROJECT_PERMISSIONS_URL: http://theseus-api-server:8080/api/internal/project/permissions
      SPRING_BOOT_BILLING_USAGE_URL: http://theseus-api-server:8080/api/internal/billing/usage
      SPRING_BOOT_TOOL_PLAN_URL: http://theseus-api-server:8080/api/internal/tool-plan/save
      SPRING_BOOT_INTERNAL_HISTORY_MESSAGES_URL: http://theseus-api-server:8080/api/internal/history/messages
      SPRING_BOOT_REMOTE_WORKSPACE_CONFIG_URL: http://theseus-api-server:8080/api/internal/remote-workspaces/connection-config
      CORE_KAFKA_BOOTSTRAP_SERVERS: theseus-local-kafka:29092
    ports:
      - "8086:8086"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SANDBOX_HOST_TEMP_ROOT:-/tmp/theseus-sandbox-shared}:${SANDBOX_CONTAINER_TEMP_ROOT:-/tmp/theseus-sandbox-shared}
    depends_on:
      theseus-local-postgres:
        condition: service_healthy
      theseus-local-kafka:
        condition: service_healthy
    networks:
      - theseus-local-network

networks:
  theseus-local-network:
    name: theseus-local-network
