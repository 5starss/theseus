services:
  theseus-local-mysql:
    image: mysql:8.4
    container_name: theseus-local-mysql
    env_file:
      - .env.local
    ports:
      - "13306:3306"
    volumes:
      - theseus-local-mysql-data:/var/lib/mysql
    networks:
      - theseus-local-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  theseus-local-postgres:
    image: pgvector/pgvector:pg16 # pgvector extension 사용을 위해 PostgreSQL 이미지를 pgvector 지원 이미지로 변경
    container_name: theseus-local-postgres
    env_file:
      - .env.local
    ports:
      - "15432:5432"
    volumes:
      - theseus-local-postgres-data:/var/lib/postgresql/data
      - ./initdb/postgres:/docker-entrypoint-initdb.d # 초기화 SQL을 마운트해 pgvector extension을 자동 생성
    networks:
      - theseus-local-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  theseus-local-network:
    name: theseus-local-network

volumes:
  theseus-local-mysql-data:
    name: theseus-local-mysql-data
  theseus-local-postgres-data:
    name: theseus-local-postgres-data
