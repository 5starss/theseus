services:
  theseus-prod-kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: theseus-prod-kafka
    restart: unless-stopped
    ports:
      - "19092:19092"
    volumes:
      - theseus-prod-kafka-data:/var/lib/kafka/data
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID must be set}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@theseus-prod-kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://theseus-prod-kafka:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:?KAFKA_EXTERNAL_HOST must be set}:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - theseus-prod-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server theseus-prod-kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  theseus-prod-kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: theseus-prod-kafka-init
    env_file:
      - .env
    depends_on:
      theseus-prod-kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -e
        kafka-topics --bootstrap-server theseus-prod-kafka:29092 --create --if-not-exists --topic "$${KAFKA_TOPIC_TOOL_PLAN_REQUEST:-theseus.tool-plan.request}" --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server theseus-prod-kafka:29092 --create --if-not-exists --topic "$${KAFKA_TOPIC_TOOL_PLAN_EVENT:-theseus.tool-plan.event}" --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server theseus-prod-kafka:29092 --create --if-not-exists --topic "$${KAFKA_TOPIC_TOOL_BUILD_REQUEST:-theseus.tool-build.request}" --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server theseus-prod-kafka:29092 --create --if-not-exists --topic "$${KAFKA_TOPIC_TOOL_BUILD_EVENT:-theseus.tool-build.event}" --partitions 3 --replication-factor 1
    networks:
      - theseus-prod-network

  theseus-prod-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: theseus-prod-kafka-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_UI_HOST_PORT:-8091}:8080"
    environment:
      AUTH_TYPE: DISABLED
      DYNAMIC_CONFIG_ENABLED: "false"
      KAFKA_CLUSTERS_0_NAME: theseus-prod
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: theseus-prod-kafka:29092
      KAFKA_CLUSTERS_0_READONLY: "true"
    depends_on:
      theseus-prod-kafka:
        condition: service_healthy
      theseus-prod-kafka-init:
        condition: service_completed_successfully
    networks:
      - theseus-prod-network

  theseus-api-server:
    build:
      context: ../../../backend/theseus-api-server
      dockerfile: Dockerfile
    image: theseus-api-server:prod
    container_name: theseus-prod-api-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SPRING_KAFKA_BOOTSTRAP_SERVERS: theseus-prod-kafka:29092
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${SPRING_KAFKA_CONSUMER_GROUP_ID:-theseus-api-server-prod}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis-stg.ssafyapp.com}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      THESEUS_CORE_BASE_URL: ${THESEUS_CORE_BASE_URL:-http://theseus-core-server:8086}
    ports:
      - "8080:8080"
    depends_on:
      theseus-prod-kafka:
        condition: service_healthy
      theseus-prod-kafka-init:
        condition: service_completed_successfully
    networks:
      - theseus-prod-network

  theseus-core-server:
    build:
      context: ../../../backend/theseus-core-server
      dockerfile: Dockerfile
    image: theseus-core-server:prod
    container_name: theseus-prod-core-server
    restart: unless-stopped
    env_file:
      - .env
    group_add:
      - "${DOCKER_GID:-988}"
    environment:
      ENV: prod
      AUTH_MODE: spring
      CORE_KAFKA_CONSUMER_ENABLED: ${CORE_KAFKA_CONSUMER_ENABLED:-true}
      CORE_LEGACY_TOOL_GENERATION_CONSUMER_ENABLED: ${CORE_LEGACY_TOOL_GENERATION_CONSUMER_ENABLED:-false}
      CORE_TOOL_PLAN_CONSUMER_ENABLED: ${CORE_TOOL_PLAN_CONSUMER_ENABLED:-true}
      CORE_KAFKA_BOOTSTRAP_SERVERS: theseus-prod-kafka:29092
      DOCKER_HOST: unix:///var/run/docker.sock
      THESEUS_DATA_DIR: ${THESEUS_DATA_DIR:-/home/appuser/.theseus/data}
      THESEUS_CUSTOM_TOOLS_DIR: /backend/theseus-core-server/theseus_engine/custom_tools
      THESEUS_PROJECT_CUSTOM_TOOLS_DIR: /backend/theseus-core-server/theseus_engine/custom_tools/projects
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-theseus-sandbox:py311-tools}
      SANDBOX_HOST_TEMP_ROOT: ${SANDBOX_HOST_TEMP_ROOT:-/tmp/theseus-sandbox-shared}
      SANDBOX_CONTAINER_TEMP_ROOT: ${SANDBOX_CONTAINER_TEMP_ROOT:-/tmp/theseus-sandbox-shared}
      SPRING_BOOT_INTERNAL_URL: http://theseus-api-server:8080
      SPRING_BOOT_AUTH_VERIFY_URL: http://theseus-api-server:8080/api/internal/auth/verify
      SPRING_BOOT_PROJECT_PERMISSIONS_URL: http://theseus-api-server:8080/api/internal/project/permissions
      SPRING_BOOT_BILLING_USAGE_URL: http://theseus-api-server:8080/api/internal/billing/usage
      SPRING_BOOT_TOOL_PLAN_URL: http://theseus-api-server:8080/api/internal/tool-plan/save
      SPRING_BOOT_INTERNAL_HISTORY_MESSAGES_URL: http://theseus-api-server:8080/api/internal/history/messages
      SPRING_BOOT_REMOTE_WORKSPACE_CONFIG_URL: ${SPRING_BOOT_REMOTE_WORKSPACE_CONFIG_URL:-http://theseus-api-server:8080/api/internal/remote-workspaces/connection-config}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SANDBOX_HOST_TEMP_ROOT:-/tmp/theseus-sandbox-shared}:${SANDBOX_CONTAINER_TEMP_ROOT:-/tmp/theseus-sandbox-shared}
      - ${THESEUS_CUSTOM_TOOLS_HOST_DIR:-/opt/theseus/custom_tools}:/backend/theseus-core-server/theseus_engine/custom_tools/projects
      - ${THESEUS_DEBUG_DUMP_HOST_DIR:-/opt/theseus/debug/dumps}:/var/log/theseus/debug/dumps
      - ${REMOTE_WORKSPACE_KEY_HOST_PATH:-/secure/theseus/keys/ssafy-ec2-key.pem}:/home/appuser/.ssh/ssafy-ec2-key.pem:ro
    ports:
      - "8086:8086"
    depends_on:
      theseus-prod-kafka:
        condition: service_healthy
      theseus-prod-kafka-init:
        condition: service_completed_successfully
      theseus-api-server:
        condition: service_started
    networks:
      - theseus-prod-network

  theseus-frontend:
    build:
      context: ../../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL must be set}
    image: theseus-frontend:prod
    container_name: theseus-prod-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      theseus-api-server:
        condition: service_started
    networks:
      - theseus-prod-network

  theseus-nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: theseus-nginx:prod
    container_name: theseus-prod-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      theseus-frontend:
        condition: service_started
      theseus-api-server:
        condition: service_started
      theseus-core-server:
        condition: service_started
    volumes:
      - theseus-certbot-www:/var/www/certbot
      - theseus-certbot-conf:/etc/letsencrypt
    networks:
      - theseus-prod-network

  certbot:
    image: certbot/certbot:latest
    container_name: theseus-certbot
    volumes:
      - theseus-certbot-www:/var/www/certbot
      - theseus-certbot-conf:/etc/letsencrypt
    networks:
      - theseus-prod-network

networks:
  theseus-prod-network:
    name: theseus-prod-network
    driver: bridge

volumes:
  theseus-prod-kafka-data:
    name: theseus-prod-kafka-data
  theseus-certbot-www:
    name: theseus-certbot-www
  theseus-certbot-conf:
    name: theseus-certbot-conf
