spring:
  config:
    import: optional:file:.env[.properties] # .env 파일을 읽어옴

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${REDIS_PORT}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        highlight_sql: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}

management:
  endpoints:
    web:
      exposure:
        include: health, metric

jwt:
  secret: ${JWT_SECRET_KEY}

logging:
  level:
    root: info
    com.s14p21a503.coreapi.common.exception: debug
    org.hibernate.SQL: off
    org.hibernate.type.descriptor.sql.BasicBinder: off
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: off