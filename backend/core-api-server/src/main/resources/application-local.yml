server:
  port: 8081

spring:
  config:
    import: optional:file:.env[.properties] # .env 파일을 읽어옴

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${REDIS_PORT}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        highlight_sql: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}

management:
  endpoints:
    web:
      exposure:
        include: health, metric

jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH:classpath:keys/private_key.pem}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:keys/public_key.pem}
  issuer: ${JWT_ISSUER:core-api-server}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

auth:
  refresh-cookie:
    name: ${AUTH_REFRESH_COOKIE_NAME:refresh_token}
    path: ${AUTH_REFRESH_COOKIE_PATH:/api/v1/auth/refresh}
    domain: ${AUTH_REFRESH_COOKIE_DOMAIN:}
    secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
    same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
    max-age-millis: ${AUTH_REFRESH_COOKIE_MAX_AGE_MILLIS:${JWT_REFRESH_EXPIRATION:1209600000}}
  csrf:
    enforce-origin-check: ${AUTH_CSRF_ENFORCE_ORIGIN_CHECK:false}
    allowed-origins: ${AUTH_CSRF_ALLOWED_ORIGINS:}
  cors:
    allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    root: info
    com.s14p21a503.coreapi.common.exception: debug
    org.hibernate.SQL: off
    org.hibernate.type.descriptor.sql.BasicBinder: off
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: off
