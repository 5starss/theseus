spring:
  datasource:
    url: jdbc:mysql://mysql:3306/stock_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: redis
      port: 6379

  kafka:
    bootstrap-servers: kafka:29092 # 도커 내부망 포트

management:
  endpoints:
    web:
      exposure:
        include: health, metric

jwt:
  secret: ${JWT_SECRET_KEY} # 서버 환경변수에서 주입

springdoc:
  # 운영 환경(prod) 보안을 위해 Swagger UI 및 API 문서 비활성화
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: info
    com.s14p21a503.coreapi.common.exception: debug
    org.hibernate.SQL: off
    org.hibernate.type.descriptor.sql.BasicBinder: off
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: off