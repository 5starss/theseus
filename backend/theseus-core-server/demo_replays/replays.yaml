              default: true
          outputFields:
            - name: summary
              label: "통합 요약"
            - name: system_metrics
              label: "CPU, 메모리, 부하 평균"
            - name: network_metrics
              label: "네트워크 상태"
            - name: stock_trends
              label: "주식 추세 분석"
            - name: alerts
              label: "경고 항목"
            - name: sanitized_output
              label: "민감 정보 제거 결과"
            - name: recommendation
              label: "권장 조치"
          mvpExclusions:
            - "인위적인 부하 생성 또는 Stress Testing"
            - "외부 IP 대상 ICMP Ping/Traceroute"
            - "주문 생성/수정/취소"
            - "시세 데이터 변경"
            - "네트워크 설정 변경"
            - "서비스 재시작"
        report_design:
          formats:
            - "JSON"
            - "Markdown"
          categories:
            - "CPU"
