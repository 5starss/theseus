version: 1

# THESEUS_DEMO_REPLAY_ENABLED=true 일 때만 사용됩니다.
# 시연 키워드, 답변, Tool 카드 내용만 여기서 바꾸면 됩니다.
# remote: none     -> Remote Workspace 미선택일 때만 매칭
# remote: required -> Remote Workspace 선택 시에만 매칭
# remote: any      -> Remote Workspace 전달 여부와 관계없이 매칭
# timing.textChunkChars    -> 답변을 몇 글자씩 스트리밍할지 설정
# timing.*DelayMs          -> 각 구간별 대기 시간(ms) 설정

plan_replays:
  - id: "1-kim-plan-before-vacation"
    modes: [PLAN]
    match:
      remote: none
      contains_any:
        - "휴가 전 플랜 생성"
        - "인수인계 모니터링 툴 계획"
    progress:
      - message: REQUEST_RECEIVED
        progressRate: 5
        delayMs: 350
      - message: PLAN_DRAFTING
        progressRate: 40
        delayMs: 900
      - message: PLAN_COMPLETED
        progressRate: 100
        delayMs: 700
    result:
      rawMarkdown: |
        ## 김대리 휴가 전 인수인계 모니터링 Tool 생성 PLAN

        김대리 부재 중 신입사원이 원격 운영 환경에서 API 상태와 시스템 리소스를 확인할 수 있도록
        읽기 전용 모니터링 Tool을 생성합니다.
      structuredPlanJson:
        version: 1
        goal: "김대리 휴가 전 인수인계 모니터링 Tool 생성"
        tasks:
          - id: task-1
            title: "원격 운영 진단 Tool 명세 작성"
            problem: "신입사원이 API 상태와 리소스를 같은 기준으로 확인해야 합니다."
            solution: "health check, CPU, memory, disk 상태를 읽기 전용으로 조회하는 Tool을 설계합니다."
            expected_effect: "휴가 기간 중 운영 진단 업무를 표준화합니다."
          - id: task-2
            title: "권한 및 승인 기준 정리"
            problem: "원격 환경 접근 Tool은 관리자 승인과 권한 등급 확인이 필요합니다."
            solution: "permissionLevel과 사용 목적을 PLAN에 명시해 승인 요청 가능 상태로 만듭니다."
            expected_effect: "관리자가 생성 승인 여부를 빠르게 판단할 수 있습니다."
        verification:
          success_criteria:
            - "PLAN 패널에 task가 표시됩니다."
            - "생성 승인 요청 버튼을 누를 수 있습니다."
      planSnapshot:
        schemaVersion: "1.0"
        planVersion: 1
        blocks:
          - blockId: task-1
            title: "원격 운영 진단 Tool 명세 작성"
            content: "health check, CPU, memory, disk 상태를 읽기 전용으로 조회하는 Tool을 설계합니다."
            order: 1
          - blockId: task-2
            title: "권한 및 승인 기준 정리"
            content: "permissionLevel과 사용 목적을 PLAN에 명시해 승인 요청 가능 상태로 만듭니다."
            order: 2

chat_replays:
  - id: "3-new-hire-monitoring-success"
    modes: [AGENT]
    match:
      remote: any
      contains_any:
        - "인수인계 업무 1"
        - "모니터링 툴 사용"
    timing:
      textChunkChars: 8
      textChunkDelayMs: 45
      beforeToolsDelayMs: 450
      toolStartDelayMs: 800
      toolCompletedDelayMs: 1300
      afterToolsDelayMs: 550
    answer:
      beforeTools: "김대리 인수인계 기준에 따라 원격 모니터링 Tool을 실행하겠습니다.\n\n"
      afterTools: "모니터링 결과 API와 시스템 리소스는 현재 정상 범위입니다. 인수인계 업무 1을 완료했습니다."
    toolStack:
      - toolName: integrated_ops_diagnostics
        toolUseId: demo-monitoring-001
        toolInput:
          services:
            - "http://localhost:8080/health"
            - "http://localhost:8081/health"
        started:
          message: "원격 운영 환경의 API 상태와 시스템 리소스를 조회합니다."
        completed:
          output: |
            {
              "overall_status": "PASS",
              "api_status": "PASS",
              "cpu_percent": 37.5,
              "mem_percent": 42.1,
              "recommendation": "정상 범위입니다."
            }

  - id: "5-new-hire-frontend-change-failed"
    modes: [AGENT]
    match:
      remote: any
      contains_any:
        - "인수인계 업무 2"
        - "프론트 변경 툴 실패"
        - "프론트엔드 변경 툴 실패"
        - "프론트 변경 실패"
        - "프론트엔드 변경 실패"
    timing:
      textChunkChars: 8
      textChunkDelayMs: 45
      beforeToolsDelayMs: 450
      toolStartDelayMs: 800
      toolFailedDelayMs: 1200
      afterToolsDelayMs: 550
    answer:
      beforeTools: "싸피 증권 랜딩 페이지 변경 Tool을 실행해 보겠습니다.\n\n"
      afterTools: "프론트 변경은 권한 등급 부족으로 실패했습니다. 관리자 권한 조정 후 다시 실행해야 합니다."
    toolStack:
      - toolName: frontend_landing_editor
        toolUseId: demo-frontend-failed-001
        toolInput:
          page: "ssafy-securities-landing"
          change: "hero copy update"
        started:
          message: "원격 프론트 프로젝트에서 랜딩 페이지 변경을 시도합니다."
        failed:
          error: "Permission denied: current user level is insufficient for remote frontend write."
          output: "권한 등급 부족으로 원격 프론트 변경 작업이 차단되었습니다."

  - id: "7-admin-frontend-change-success"
    modes: [AGENT]
    match:
      remote: any
      contains_any:
        - "관리자 프론트 변경 성공"
        - "프론트 변경 성공"
        - "프론트엔드 변경 성공"
        - "AI 가이드 모달"
        - "AIGuideModal"
        - "에메랄드/청록"
    timing:
      textChunkChars: 10
      textChunkDelayMs: 35
      beforeToolsDelayMs: 420
      toolStartDelayMs: 520
      toolCompletedDelayMs: 760
      afterToolsDelayMs: 480
    answer:
      beforeTools: |
        관리자 권한으로 리모트 워크스페이스의 프론트 프로젝트를 확인하고,
        AI 가이드 모달의 스타일만 에메랄드/청록 계열로 변경하겠습니다.

      afterTools: |
        AIGuideModal.tsx 파일의 스타일을 요청하신 에메랄드/청록 계열로 변경 완료했습니다.

        변경 사항 요약
        - 상단 헤더: 기존 보라색에서 에메랄드/청록 그라데이션으로 변경했습니다.
        - STEP 번호 배지: 같은 계열의 진한 에메랄드 색상으로 정리했습니다.
        - Tip 박스: 연한 청록 배경과 진한 테두리로 변경했습니다.
        - 확인 버튼: 동일한 강조색으로 맞추고 hover/shadow 색상도 정리했습니다.

        검토 결과
        - Tailwind class 적용과 TSX 구조에 이상이 없음을 확인했습니다.
        - isOpen, onClose 등 동작 로직은 변경하지 않았습니다.
        - 시연에서 더 눈에 띄는 청록색 톤의 가이드 모달을 확인하실 수 있습니다.
    toolStack:
      - toolName: remote_glob
        toolUseId: demo-ai-guide-glob-001
        toolInput:
          pattern: "**/AIGuideModal.tsx"
        started:
          message: "리모트 워크스페이스에서 AI 가이드 모달 파일 위치를 검색합니다."
        completed:
          output: |
            Found 1 matches:
            frontend/src/components/layout/sidebar/AIGuideModal.tsx

      - toolName: remote_read_file
        toolUseId: demo-ai-guide-read-001
        toolInput:
          path: "frontend/src/components/layout/sidebar/AIGuideModal.tsx"
        started:
          message: "현재 AIGuideModal.tsx 스타일과 컴포넌트 구조를 확인합니다."
