version: 1

# THESEUS_DEMO_REPLAY_ENABLED=true 일 때만 사용됩니다.
# 시연 키워드, 답변, Tool 카드 내용만 여기서 바꾸면 됩니다.
# remote: none     -> Remote Workspace 미선택일 때만 매칭
# remote: required -> Remote Workspace 선택 시에만 매칭
# remote: any      -> Remote Workspace 전달 여부와 관계없이 매칭
# timing.textChunkChars    -> 답변을 몇 글자씩 스트리밍할지 설정
# timing.*DelayMs          -> 각 구간별 대기 시간(ms) 설정

plan_replays:
  - id: "1-kim-plan-before-vacation"
    modes: [PLAN]
    match:
      remote: none
      contains_any:
        - "휴가 전 플랜 생성"
        - "인수인계 모니터링 툴 계획"
    progress:
      - message: REQUEST_RECEIVED
        progressRate: 5
        delayMs: 350
      - message: PLAN_DRAFTING
        progressRate: 40
        delayMs: 900
      - message: PLAN_COMPLETED
        progressRate: 100
        delayMs: 700
    result:
      rawMarkdown: |
        ## 김대리 휴가 전 인수인계 모니터링 Tool 생성 PLAN

        김대리 부재 중 신입사원이 원격 운영 환경에서 API 상태와 시스템 리소스를 확인할 수 있도록
        읽기 전용 모니터링 Tool을 생성합니다.
      structuredPlanJson:
        version: 1
        goal: "김대리 휴가 전 인수인계 모니터링 Tool 생성"
        tasks:
          - id: task-1
            title: "원격 운영 진단 Tool 명세 작성"
            problem: "신입사원이 API 상태와 리소스를 같은 기준으로 확인해야 합니다."
            solution: "health check, CPU, memory, disk 상태를 읽기 전용으로 조회하는 Tool을 설계합니다."
            expected_effect: "휴가 기간 중 운영 진단 업무를 표준화합니다."
          - id: task-2
            title: "권한 및 승인 기준 정리"
            problem: "원격 환경 접근 Tool은 관리자 승인과 권한 등급 확인이 필요합니다."
            solution: "permissionLevel과 사용 목적을 PLAN에 명시해 승인 요청 가능 상태로 만듭니다."
            expected_effect: "관리자가 생성 승인 여부를 빠르게 판단할 수 있습니다."
        verification:
          success_criteria:
            - "PLAN 패널에 task가 표시됩니다."
            - "생성 승인 요청 버튼을 누를 수 있습니다."
      planSnapshot:
        schemaVersion: "1.0"
        planVersion: 1
        blocks:
          - blockId: task-1
            title: "원격 운영 진단 Tool 명세 작성"
            content: "health check, CPU, memory, disk 상태를 읽기 전용으로 조회하는 Tool을 설계합니다."
            order: 1
          - blockId: task-2
            title: "권한 및 승인 기준 정리"
            content: "permissionLevel과 사용 목적을 PLAN에 명시해 승인 요청 가능 상태로 만듭니다."
            order: 2

  - id: "2-server-health-monitor-tool-plan"
    modes: [PLAN]
    match:
      remote: none
      contains_any:
        - "서버 상태 모니터링 툴"
        - "서버 상태 통합 진단 툴"
        - "서버 헬스 모니터"
        - "CPU 메모리 네트워크 리포트"
        - "server_health_monitor"
    progress:
      - message: REQUEST_RECEIVED
        progressRate: 5
        delayMs: 300
      - message: PLAN_DRAFTING
        progressRate: 35
        delayMs: 900
      - message: PLAN_STRUCTURING
        progressRate: 75
        delayMs: 650
      - message: PLAN_VALIDATING
        progressRate: 90
        delayMs: 500
      - message: PLAN_COMPLETED
        progressRate: 100
        delayMs: 450
    result:
      rawMarkdown: |
        ## 서버 상태 통합 진단 Tool 생성 PLAN

        현재 서버의 CPU, 메모리, 네트워크 연결 상태를 한 번에 수집하고
        이상 징후를 `PASS`, `WARNING`, `FAIL`, `SKIPPED`, `INFO` 상태로 리포트하는
        읽기 전용 진단 Tool을 생성합니다.

        보안 정책상 shell 실행, 외부 ping, traceroute, 패킷 캡처는 제외하고,
        `psutil` 기반의 안전한 시스템 메트릭 수집과 임계치 분석에 집중합니다.

        ### 실행 스펙
        - 도구 이름: `server_health_monitor`
        - 권한 레벨: 1, 시스템 상태만 읽는 안전한 진단 도구
        - 검증 전략: `core_sandbox_gate`
        - 입력값: CPU 경고/위험 임계치, 메모리 경고/위험 임계치, 네트워크 연결 수 임계치
        - 결과 형식: JSON과 Markdown 요약 리포트

      structuredPlanJson:
        version: 1
        goal: "서버 CPU, 메모리, 네트워크 상태를 통합 진단하고 이상 징후를 리포트하는 읽기 전용 Tool 생성"
        summary:
          problem: "서버 상태를 한 번에 확인하는 통합 진단 Tool이 없어 CPU, 메모리, 네트워크 상태를 개별적으로 확인해야 합니다."
          approach: "psutil 기반 메트릭 수집, 임계치 비교, 상태 판정, JSON/Markdown 리포트 생성을 하나의 BaseTool로 구현합니다."
          security_scope: "shell 실행, subprocess, socket 기반 외부 연결 테스트, 네트워크 설정 변경, 서비스 재시작은 MVP에서 제외합니다."
        execution_spec:
          toolName: "server_health_monitor"
          displayName: "서버 상태 통합 진단"
          targetFiles:
            - "/custom-tools/5/server_health_monitor_tool.py"
            - "/custom-tools/5/server_health_monitor_tool.meta.json"
          permissionLevel: 1
          validationStrategy: "core_sandbox_gate"
          inputFields:
            - name: threshold_cpu_warning
              label: "CPU 주의 임계치"
              description: "전체 CPU 사용률이 이 값 이상이면 WARNING으로 판정합니다."
              default: 80
            - name: threshold_cpu_fail
              label: "CPU 위험 임계치"
              description: "전체 CPU 사용률이 이 값 이상이면 FAIL로 판정합니다."
              default: 95
            - name: threshold_mem_warning
              label: "메모리 주의 임계치"
              description: "메모리 사용률이 이 값 이상이면 WARNING으로 판정합니다."
              default: 85
            - name: threshold_mem_fail
              label: "메모리 위험 임계치"
              description: "메모리 사용률이 이 값 이상이면 FAIL로 판정합니다."
              default: 95
          outputFields:
            - name: check_id
              label: "진단 항목 ID"
            - name: category
              label: "분류"
            - name: target
              label: "진단 대상"
            - name: status
              label: "상태"
              allowedValues:
                - "PASS: 정상"
                - "WARNING: 주의"
                - "FAIL: 위험"
                - "SKIPPED: 수집 생략"
                - "INFO: 참고 정보"
            - name: evidence
              label: "판정 근거"
            - name: sanitized_output
              label: "민감 정보 제거 결과"
            - name: recommendation
              label: "권장 조치"
        tasks:
          - id: task-1
            title: "서버 상태 모니터링 Tool 구현"
            problem: "CPU, 메모리, 네트워크 연결 상태를 안전하게 수집하고 분석하는 로직이 필요합니다."
            solution: "BaseTool을 상속한 ServerHealthMonitorTool을 만들고 psutil로 읽기 전용 메트릭을 수집합니다."
            expected_effect: "서버의 전반적인 건강 상태와 리소스 병목 가능성을 한눈에 파악할 수 있습니다."
            description: "psutil.cpu_percent(), psutil.virtual_memory(), psutil.net_connections()를 사용하고 CPU 80% 이상, 메모리 90% 이상 같은 임계치 기준으로 상태를 판정합니다."
            target_files:
              - "/custom-tools/5/server_health_monitor_tool.py"
          - id: task-1-1
            parent_id: task-1
            title: "메트릭 수집 로직 구현"
            problem: "시스템 자원과 네트워크 연결 수를 신뢰할 수 있는 방식으로 수집해야 합니다."
            solution: "전체 CPU 사용률, 코어별 CPU 사용률, 메모리 사용률, 가용 메모리, ESTABLISHED 네트워크 연결 수를 내부 메서드로 수집합니다."
            expected_effect: "리포트 생성에 필요한 기초 데이터를 안정적으로 확보합니다."
            target_files:
              - "/custom-tools/5/server_health_monitor_tool.py"
          - id: task-1-2
            parent_id: task-1
            title: "상태 분석 및 리포트 생성"
            problem: "수집된 숫자를 사용자가 바로 이해할 수 있는 진단 결과로 바꾸는 기준이 필요합니다."
            solution: "PASS, WARNING, FAIL, SKIPPED, INFO 상태를 부여하고 원인과 권장 조치를 JSON/Markdown 리포트로 제공합니다."
            expected_effect: "사용자가 CPU 과부하, 메모리 부족, 네트워크 연결 급증 같은 징후를 즉시 파악할 수 있습니다."
            target_files:
              - "/custom-tools/5/server_health_monitor_tool.py"
          - id: task-2
            title: "Tool 메타데이터 설정"
            problem: "Theseus 엔진이 Tool을 인식하고 입력/출력 계약을 표시하려면 메타데이터가 필요합니다."
            solution: "toolName, displayName, permissionLevel, inputs, outputs를 담은 meta.json을 작성합니다."
            expected_effect: "Tool 인터페이스가 명확해지고 재사용 가능한 시연/운영 기준이 생깁니다."
            target_files:
              - "/custom-tools/5/server_health_monitor_tool.meta.json"
        caveats:
          - "psutil 의존성이 필요하며 /proc 접근 권한에 따라 일부 수집값은 SKIPPED가 될 수 있습니다."
          - "외부 IP ping, traceroute, 부하 생성, 네트워크 설정 변경, 서비스 재시작은 MVP 범위에서 제외합니다."
          - "정밀 외부 연결성 검사가 꼭 필요하면 Remote Workspace 전용 read-only adapter 또는 기존 remote_check_* Tool 조합을 Plan B로 사용합니다."
        verification:
          success_criteria:
            - "CPU, 메모리, 네트워크 연결 상태가 포함된 JSON/Markdown 리포트가 에러 없이 생성됩니다."
            - "threshold_cpu와 threshold_mem 값을 조정했을 때 WARNING/FAIL 판정이 정상적으로 바뀝니다."
            - "subprocess, socket 등 금지된 모듈을 import하지 않습니다."
          test_commands:
            - "python3 -B -m py_compile /custom-tools/5/server_health_monitor_tool.py"
          manual_checks:
            - "Tool 실행 결과의 CPU, 메모리 수치가 현재 시스템 상태와 크게 어긋나지 않는지 확인합니다."
            - "리소스 사용량이 높은 환경에서 WARNING 또는 FAIL 리포트가 출력되는지 확인합니다."
            - "코드 검토로 shell 실행과 네트워크 설정 변경 로직이 없는지 확인합니다."
      planSnapshot:
        schemaVersion: "1.0"
        planVersion: 1
        blocks:
          - blockId: overview
            title: "개요"
            content: "서버의 CPU, 메모리, 네트워크 연결 상태를 한 번에 확인하고 이상 징후를 리포트하는 읽기 전용 시스템 진단 Tool을 생성합니다."
            order: 1
          - blockId: task-1
            title: "서버 상태 모니터링 Tool 구현"
            content: "ServerHealthMonitorTool을 구현하고 psutil 기반으로 CPU, 메모리, 네트워크 연결 상태를 안전하게 수집합니다."
            order: 2
          - blockId: task-1-1
            title: "메트릭 수집 로직 구현"
            content: "전체/코어별 CPU 사용률, 메모리 사용률과 가용 메모리, ESTABLISHED 네트워크 연결 수를 수집합니다."
            order: 3
          - blockId: task-1-2
            title: "상태 분석 및 리포트 생성"
            content: "수집값을 임계치와 비교해 PASS, WARNING, FAIL, SKIPPED, INFO 상태로 판정하고 권장 조치를 포함한 리포트를 생성합니다."
            order: 4
          - blockId: task-2
            title: "Tool 메타데이터 설정"
            content: "server_health_monitor Tool의 입력값, 출력 필드, 권한 레벨, 검증 전략을 meta.json에 정의합니다."
            order: 5
          - blockId: verification
            title: "검증 기준"
            content: "py_compile, 금지 모듈 검토, 리소스 수치 확인, 임계치 조정에 따른 WARNING/FAIL 판정 확인을 수행합니다."
            order: 6

chat_replays:
  - id: "3-new-hire-monitoring-success"
    modes: [AGENT]
    match:
      remote: any
      contains_any:
        - "인수인계 업무 1"
        - "모니터링 툴 사용"
    timing:
      textChunkChars: 8
      textChunkDelayMs: 45
      beforeToolsDelayMs: 450
      toolStartDelayMs: 800
      toolCompletedDelayMs: 1300
      afterToolsDelayMs: 550
    answer:
      beforeTools: "김대리 인수인계 기준에 따라 원격 모니터링 Tool을 실행하겠습니다.\n\n"
      afterTools: "모니터링 결과 API와 시스템 리소스는 현재 정상 범위입니다. 인수인계 업무 1을 완료했습니다."
    toolStack:
      - toolName: integrated_ops_diagnostics
        toolUseId: demo-monitoring-001
        toolInput:
          services:
            - "http://localhost:8080/health"
            - "http://localhost:8081/health"
        started:
          message: "원격 운영 환경의 API 상태와 시스템 리소스를 조회합니다."
        completed:
          output: |
            {
              "overall_status": "PASS",
              "api_status": "PASS",
              "cpu_percent": 37.5,
              "mem_percent": 42.1,
              "recommendation": "정상 범위입니다."
            }

  - id: "5-new-hire-frontend-change-failed"
    modes: [AGENT]
    match:
      remote: any
      contains_any:
        - "인수인계 업무 2"
        - "프론트 변경 툴 실패"
        - "프론트엔드 변경 툴 실패"
        - "프론트 변경 실패"
        - "프론트엔드 변경 실패"
    timing:
      textChunkChars: 8
      textChunkDelayMs: 45
      beforeToolsDelayMs: 450
      toolStartDelayMs: 800
      toolFailedDelayMs: 1200
      afterToolsDelayMs: 550
    answer:
      beforeTools: "싸피 증권 랜딩 페이지 변경 Tool을 실행해 보겠습니다.\n\n"
      afterTools: "프론트 변경은 권한 등급 부족으로 실패했습니다. 관리자 권한 조정 후 다시 실행해야 합니다."
    toolStack:
      - toolName: frontend_landing_editor
        toolUseId: demo-frontend-failed-001
        toolInput:
          page: "ssafy-securities-landing"
          change: "hero copy update"
        started:
          message: "원격 프론트 프로젝트에서 랜딩 페이지 변경을 시도합니다."
        failed:
          error: "Permission denied: current user level is insufficient for remote frontend write."
          output: "권한 등급 부족으로 원격 프론트 변경 작업이 차단되었습니다."

  - id: "7-admin-frontend-change-success"
    modes: [AGENT]
    match:
      remote: any
      contains_any:
        - "관리자 프론트 변경 성공"
        - "프론트 변경 성공"
        - "프론트엔드 변경 성공"
        - "AI 가이드 모달"
        - "AIGuideModal"
        - "에메랄드/청록"
    timing:
      textChunkChars: 10
      textChunkDelayMs: 35
      beforeToolsDelayMs: 420
      toolStartDelayMs: 520
      toolCompletedDelayMs: 760
      afterToolsDelayMs: 480
    answer:
      beforeTools: |
        관리자 권한으로 리모트 워크스페이스의 프론트 프로젝트를 확인하고,
        AI 가이드 모달의 스타일만 에메랄드/청록 계열로 변경하겠습니다.

      afterTools: |
        AIGuideModal.tsx 파일의 스타일을 요청하신 에메랄드/청록 계열로 변경 완료했습니다.

        변경 사항 요약
        - 상단 헤더: 기존 보라색에서 에메랄드/청록 그라데이션으로 변경했습니다.
        - STEP 번호 배지: 같은 계열의 진한 에메랄드 색상으로 정리했습니다.
        - Tip 박스: 연한 청록 배경과 진한 테두리로 변경했습니다.
        - 확인 버튼: 동일한 강조색으로 맞추고 hover/shadow 색상도 정리했습니다.

        검토 결과
        - Tailwind class 적용과 TSX 구조에 이상이 없음을 확인했습니다.
        - isOpen, onClose 등 동작 로직은 변경하지 않았습니다.
        - 시연에서 더 눈에 띄는 청록색 톤의 가이드 모달을 확인하실 수 있습니다.
    toolStack:
      - toolName: remote_glob
        toolUseId: demo-ai-guide-glob-001
        toolInput:
          pattern: "**/AIGuideModal.tsx"
