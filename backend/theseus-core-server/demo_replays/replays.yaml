version: 1

# THESEUS_DEMO_REPLAY_ENABLED=true 일 때만 사용됩니다.
# 시연 키워드, 답변, Tool 카드 내용만 여기서 바꾸면 됩니다.
# remote: none     -> Remote Workspace 미선택일 때만 매칭
# remote: required -> Remote Workspace 선택 시에만 매칭
# remote: any      -> Remote Workspace 전달 여부와 관계없이 매칭
# timing.textChunkChars    -> 답변을 몇 글자씩 스트리밍할지 설정
# timing.*DelayMs          -> 각 구간별 대기 시간(ms) 설정

plan_replays:
  - id: "1-kim-plan-before-vacation"
    modes: [PLAN]
    match:
      remote: none
      exact:
        - "ssafy 증권의 cpu, 네트워크, 메모리, 부하 평균 그리고 주식의 추세를 모니터링 하는 툴을 만들어줘"
      contains_all:
        - "ssafy 증권"
        - "cpu"
        - "네트워크"
        - "메모리"
        - "부하 평균"
        - "주식"
        - "추세"
        - "모니터링"
    progress:
      - message: REQUEST_RECEIVED
        progressRate: 5
        delayMs: 700
        chunk: "PLAN 요청을 접수했습니다.\n"
      - message: PLAN_DRAFTING
        progressRate: 20
        delayMs: 1600
        chunk: "SSAFY 증권 운영 지표와 주식 추세 모니터링 요구사항을 분석하고 있습니다.\n"
      - message: PLAN_DRAFTING
        progressRate: 45
        delayMs: 2400
        chunk: "CPU, 메모리, 부하 평균, 네트워크 I/O, 주가 추세 계산 항목을 Tool 명세로 정리하고 있습니다.\n"
      - message: PLAN_STRUCTURING
        progressRate: 72
        delayMs: 1700
        chunk: "수집 로직, 임계치 판정, 추세 분석 결과, 출력 리포트 필드를 PLAN 카드 구조로 변환하고 있습니다.\n"
      - message: PLAN_VALIDATING
        progressRate: 90
        delayMs: 1300
        chunk: "운영 환경을 변경하지 않는 읽기 전용 Tool인지 검증 기준을 확인하고 있습니다.\n"
      - message: PLAN_COMPLETED
        progressRate: 100
        delayMs: 900
        chunk: "PLAN 초안이 준비되었습니다.\n"
    result:
      rawMarkdown: |
        ## SSAFY 증권 통합 모니터링 Tool 생성 PLAN

        SSAFY 증권 서비스의 CPU, 네트워크, 메모리, 부하 평균과 주요 주식 종목의 가격 추세를
        한 번에 점검하는 읽기 전용 `ssafy_securities_monitor` Tool을 생성합니다.

        이 Tool은 운영 서버의 시스템 지표와 주식 시계열 데이터를 함께 수집해
        서비스 부하와 시장 데이터 흐름을 같은 리포트에서 비교할 수 있도록 설계합니다.
        시스템 지표는 `PASS`, `WARNING`, `FAIL`, `SKIPPED`, `INFO` 상태로 요약하고,
        주식 추세는 상승, 하락, 횡보, 변동성 확대 같은 분석 라벨과 근거 지표를 함께 제공합니다.

        ### 문제 분석
        - CPU, 메모리, 부하 평균, 네트워크 I/O가 개별 지표로 흩어져 있으면 서비스 병목을 한눈에 판단하기 어렵습니다.
        - 증권 서비스는 시스템 상태가 정상이어도 주식 데이터 갱신 지연, 거래량 급증, 가격 급변이 함께 발생할 수 있습니다.
        - 현재는 운영 부하와 주식 추세를 같은 기준으로 묶어 보여주는 통합 모니터링 Tool이 없습니다.
        - 보안 정책상 shell 실행, 서비스 재시작, 네트워크 설정 변경, 주문 생성/수정/취소는 수행하지 않습니다.

        ### 주요 작업
        1. **통합 모니터링 Tool 스키마 정의**
           - 문제: 시스템 지표와 주식 추세 분석 결과를 일관된 입력/출력 구조로 제공해야 합니다.
           - 해결 방향: `SsafySecuritiesMonitorTool`을 `BaseTool`로 구현하고 모니터링 대상 종목, 조회 기간, 임계치, 출력 형식을 입력값으로 정의합니다.
           - 구현 내용: Tool 입력 모델, 출력 모델, 상태값, 민감 정보 제거 규칙, 리포트 포맷을 정리합니다.
           - 기대 효과: 프론트와 관리자 화면에서 같은 구조로 결과를 렌더링할 수 있습니다.
           - 영향 파일: `/custom-tools/5/ssafy_securities_monitor_tool.py`

        2. **시스템 메트릭 수집 로직 구현**
           - 문제: CPU, 메모리, 부하 평균을 신뢰할 수 있는 방식으로 수집해야 합니다.
           - 해결 방향: `psutil` 기반 CPU 사용률, 메모리 사용률, 가용 메모리, 시스템 load average를 읽기 전용으로 수집합니다.
           - 구현 내용: 전체 CPU, 코어별 CPU, memory percent, available memory, 1/5/15분 부하 평균을 수집합니다.
           - 기대 효과: 운영 서버의 현재 부하 상태와 병목 가능성을 빠르게 파악할 수 있습니다.
           - 영향 파일: `/custom-tools/5/ssafy_securities_monitor_tool.py`

        3. **네트워크 상태 수집 로직 구현**
           - 문제: 네트워크 병목은 CPU/메모리만으로 판단하기 어렵습니다.
           - 해결 방향: 네트워크 송수신 바이트, 패킷 수, 오류/드롭 수, 활성 연결 수를 수집하고 이전 샘플 대비 변화량을 계산합니다.
           - 구현 내용: `psutil.net_io_counters`, `psutil.net_connections`를 사용하되 권한 제한 시 `SKIPPED`로 안전하게 처리합니다.
           - 기대 효과: 트래픽 급증이나 연결 오류 증가를 운영 부하와 함께 확인할 수 있습니다.
           - 영향 파일: `/custom-tools/5/ssafy_securities_monitor_tool.py`

        4. **주식 추세 분석 로직 구현**
           - 문제: 단순 현재가만으로는 주식 흐름을 판단하기 어렵습니다.
           - 해결 방향: 최근 가격 시계열을 기준으로 등락률, 이동평균, 거래량 변화, 변동성을 계산하고 추세 라벨을 산출합니다.
           - 구현 내용: `lookback_minutes`, `symbols`, `trend_window` 입력을 기준으로 상승/하락/횡보/변동성 확대 상태를 판정합니다.
           - 기대 효과: 운영 리포트에서 서버 부하와 주식 데이터 흐름을 함께 해석할 수 있습니다.
           - 영향 파일: `/custom-tools/5/ssafy_securities_monitor_tool.py`

        5. **통합 리포트와 권한 메타데이터 구성**
           - 문제: 분석 결과를 사용자 화면에서 바로 확인할 수 있는 리포트 형식과 Tool 메타데이터가 필요합니다.
           - 해결 방향: JSON과 Markdown 결과를 모두 제공하고, 권한 레벨과 입력/출력 필드를 meta.json에 정의합니다.
           - 구현 내용: 시스템 상태 요약, 주식 추세 요약, 위험 항목, 권장 조치, 수집 생략 사유를 포함합니다.
           - 기대 효과: 운영자와 관리자가 같은 리포트를 기준으로 대응 여부를 판단할 수 있습니다.
           - 영향 파일: `/custom-tools/5/ssafy_securities_monitor_tool.meta.json`

        ### 주의 사항
        - `psutil` 라이브러리 의존성이 필요합니다.
        - `/proc` 파일 시스템 접근 권한에 따라 일부 정보 수집이 제한될 수 있습니다.
        - 주식 시계열 데이터는 read-only API 또는 제공된 샘플 데이터만 조회합니다.
        - 외부 네트워크 ping, traceroute, 정밀 패킷 캡처, 부하 생성은 수행하지 않습니다.
        - 주문 생성, 주문 취소, 시세 데이터 변경, 서비스 재시작 같은 쓰기 작업은 수행하지 않습니다.

        ### 대안 / Plan B
        - **read-only 데이터 어댑터 분리**
        - 실제 주식 시계열 API가 환경별로 다르면 Tool 내부에 데이터 어댑터 인터페이스를 두고, 운영/시연/테스트 데이터 소스를 분리합니다.
        - 정밀 네트워크 검사가 필요하면 커스텀 Tool 내부에서 직접 수행하지 않고 승인된 Remote Workspace read-only Tool을 조합합니다.
        - 트레이드오프: 초기 구현은 조금 복잡해지지만 운영 환경 변경 없이 안전하게 확장할 수 있습니다.

        ### 실행 스펙
        - 도구 이름: `ssafy_securities_monitor`
        - 표시 이름: `SSAFY 증권 통합 모니터링`
        - 권한 레벨: 1, 시스템 지표와 주식 데이터를 읽기만 하는 안전한 진단 도구
        - 검증 전략: `core_sandbox_gate`
        - 상태값: `PASS`, `WARNING`, `FAIL`, `SKIPPED`, `INFO`
        - 입력값: `symbols`, `lookback_minutes`, `threshold_cpu`, `threshold_mem`, `threshold_load`, `include_network`, `include_stock_trend`
        - MVP 제외: 인위적인 부하 생성, 외부 IP 대상 ICMP Ping/Traceroute, 주문 생성/수정/취소, 네트워크 설정 변경, 서비스 재시작
        - 결과 필드: `summary`, `system_metrics`, `network_metrics`, `stock_trends`, `alerts`, `sanitized_output`, `recommendation`

        ### 검증 기준
        - CPU, 메모리, 부하 평균, 네트워크 상태, 주식 추세가 포함된 JSON/Markdown 리포트가 에러 없이 생성되어야 합니다.
        - Tool 실행 시 CPU, 메모리, load average 수치가 현재 시스템 상태와 크게 어긋나지 않아야 합니다.
        - 주식 가격 급등락 또는 거래량 급증 데이터에서 추세 라벨과 경고 메시지가 정상적으로 출력되어야 합니다.
        - `subprocess`, shell 실행, 주문 쓰기 요청, 시세 데이터 변경 등 금지된 동작이 없는지 코드 검토로 확인합니다.
      structuredPlanJson:
        version: 1
        goal: "SSAFY 증권의 시스템 부하와 주식 추세를 통합 모니터링하는 읽기 전용 Tool 생성"
        summary:
          requestedBy: "operator"
          toolName: "ssafy_securities_monitor"
          displayName: "SSAFY 증권 통합 모니터링"
          permissionLevel: 1
          goal: "SSAFY 증권의 CPU, 네트워크, 메모리, 부하 평균과 주식 추세를 같은 리포트에서 점검합니다."
          problem: "운영 부하 지표와 주식 추세 지표가 분리되어 있으면 장애 징후와 시장 데이터 변동을 함께 해석하기 어렵습니다."
          current_state: "CPU, 메모리, 네트워크, load average, 주식 추세를 통합 분석하는 전용 Tool이 없습니다."
          approach: "psutil 기반 시스템 메트릭 수집, read-only 주식 시계열 조회, 추세 계산, 임계치 판정, JSON/Markdown 리포트 생성을 하나의 BaseTool로 구성합니다."
          security_scope: "shell 실행, subprocess, 주문 생성/수정/취소, 시세 데이터 변경, 네트워크 설정 변경, 서비스 재시작은 제외합니다."
          scope: "SSAFY 증권 운영 환경의 시스템 지표와 주식 추세를 읽기 전용으로 점검"
          inputPromptExamples:
            - "ssafy 증권의 cpu, 네트워크, 메모리, 부하 평균 그리고 주식의 추세를 모니터링 하는 툴을 만들어줘"
            - "SSAFY 증권 서버 부하와 주식 추세를 같이 보는 모니터링 툴을 만들어줘"
            - "CPU 메모리 네트워크와 주가 추세를 한 번에 리포트하는 도구를 설계해줘"
            - "ssafy_securities_monitor로 시스템 상태와 종목 추세를 같이 분석하게 해줘"
          excluded:
            - "파일 수정"
            - "배포"
            - "서비스 재시작"
            - "shell 실행"
            - "주문 생성/수정/취소"
            - "시세 데이터 변경"
        problem_analysis:
          need: "운영 부하와 주식 추세를 같은 화면에서 해석할 수 있도록 시스템 메트릭과 주식 시계열 분석을 하나의 리포트로 묶는 로직이 필요합니다."
          constraint: "보안 정책상 shell 실행, 서비스 변경, 주문 쓰기 요청, 시세 데이터 변경은 제한됩니다."
          missing_capability: "개별 시스템 metric 확인은 가능하지만 CPU, 네트워크, 메모리, load average와 주식 추세를 통합 분석하는 Tool은 없습니다."
        execution_spec:
          toolName: "ssafy_securities_monitor"
          displayName: "SSAFY 증권 통합 모니터링"
          targetFiles:
            - "/custom-tools/5/ssafy_securities_monitor_tool.py"
            - "/custom-tools/5/ssafy_securities_monitor_tool.meta.json"
