version: 1

# THESEUS_DEMO_REPLAY_ENABLED=true 일 때만 사용됩니다.
# 시연 키워드, 답변, Tool 카드 내용만 여기서 바꾸면 됩니다.
# remote: none     -> Remote Workspace 미선택일 때만 매칭
# remote: required -> Remote Workspace 선택 시에만 매칭
# remote: any      -> Remote Workspace 전달 여부와 관계없이 매칭
# timing.textChunkChars    -> 답변을 몇 글자씩 스트리밍할지 설정
# timing.*DelayMs          -> 각 구간별 대기 시간(ms) 설정

plan_replays:
  - id: "1-kim-plan-before-vacation"
    modes: [PLAN]
    match:
      remote: none
      contains_any:
        - "휴가 전 플랜 생성"
        - "인수인계 모니터링 툴 계획"
        - "김대리 휴가 전 서버 모니터링 툴 생성"
        - "싸피증권 서버 모니터링 툴 계획"
        - "server_health_monitor 인수인계"
    progress:
      - message: REQUEST_RECEIVED
        progressRate: 5
        delayMs: 350
      - message: PLAN_DRAFTING
        progressRate: 40
        delayMs: 900
      - message: PLAN_COMPLETED
        progressRate: 100
        delayMs: 700
    result:
      rawMarkdown: |
        ## 김대리 휴가 전 인수인계 모니터링 Tool 생성 PLAN

        김대리 휴가 기간 동안 신입사원이 싸피증권 서버 운영 상태를 같은 기준으로 점검할 수 있도록
        `server_health_monitor` Tool을 생성합니다.

        이 Tool은 원격 운영 환경의 API health, 주식 시세 요약 API, 주문 처리 health,
        CPU, 메모리, 부하 평균, 네트워크 연결 상태를 읽기 전용으로 수집하고
        이상 징후를 `PASS`, `WARNING`, `FAIL`, `SKIPPED` 상태로 요약합니다.
        운영 환경을 변경하지 않는 조회 전용 Tool이므로 신입사원에게도 안전하게 위임할 수 있습니다.

        ### 주요 작업
        1. **운영 상태 수집 기준 정의**
           - `/health`, `/api/v1/stocks/summary`, `/api/v1/orders/health` 응답을 확인합니다.
           - CPU, 메모리, 부하 평균, ESTABLISHED 네트워크 연결 수를 수집합니다.
           - 각 항목을 `PASS`, `WARNING`, `FAIL`, `SKIPPED`로 판정합니다.

        2. **인수인계용 리포트 생성**
           - 신입사원이 바로 읽을 수 있도록 JSON 원본과 Markdown 요약을 함께 제공합니다.
           - 문제가 있을 경우 원인 후보와 권장 조치를 표시합니다.

        3. **권한 및 승인 기준 정리**
           - 권한 레벨은 1로 제한합니다.
           - 파일 수정, 배포, 서비스 재시작, shell 실행은 제외합니다.
           - 관리자 승인 후 프로젝트 공용 Tool로 등록합니다.
