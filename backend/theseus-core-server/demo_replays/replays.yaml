          current_state: "현재 서버 모니터링을 위한 통합 진단 Tool은 부재하며, 개별적인 원격 체크 Tool만 존재합니다."
          approach: "psutil 기반 메트릭 수집, 임계치 비교, 상태 판정, JSON/Markdown 리포트 생성을 하나의 BaseTool로 구현합니다."
          security_scope: "보안 정책상 shell 실행, subprocess, socket 기반 외부 연결 테스트, 네트워크 설정 변경, 서비스 재시작은 MVP에서 제외합니다."
        problem_analysis:
          need: "CPU, 메모리, 네트워크 연결 상태를 안전하게 수집하고 분석하는 로직이 필요합니다."
          constraint: "보안 정책상 shell 실행 및 특정 네트워크 모듈 사용이 제한됩니다."
          missing_capability: "개별 원격 체크 Tool은 존재하지만 서버 상태를 하나의 리포트로 묶는 통합 진단 Tool이 없습니다."
        execution_spec:
          toolName: "server_health_monitor"
          displayName: "서버 상태 통합 진단"
          targetFiles:
            - "/custom-tools/5/server_health_monitor_tool.py"
            - "/custom-tools/5/server_health_monitor_tool.meta.json"
          permissionLevel: 1
          validationStrategy: "core_sandbox_gate"
          statusValues:
            - "PASS"
            - "WARNING"
            - "FAIL"
            - "SKIPPED"
            - "INFO"
          inputFields:
            - name: threshold_cpu
              label: "CPU 임계치"
              description: "전체 CPU 사용률이 이 값 이상이면 WARNING 이상 상태로 판정합니다."
              default: 80
            - name: threshold_mem
              label: "메모리 임계치"
              description: "메모리 사용률이 이 값 이상이면 WARNING 이상 상태로 판정합니다."
              default: 90
          outputFields:
            - name: check_id
              label: "진단 항목 ID"
            - name: category
              label: "분류"
            - name: target
              label: "진단 대상"
            - name: status
              label: "상태"
              allowedValues:
                - "PASS: 정상"
                - "WARNING: 주의"
                - "FAIL: 위험"
                - "SKIPPED: 수집 생략"
                - "INFO: 참고 정보"
            - name: evidence
              label: "판정 근거"
            - name: sanitized_output
              label: "민감 정보 제거 결과"
            - name: recommendation
              label: "권장 조치"
          mvpExclusions:
            - "인위적인 부하 생성 또는 Stress Testing"
            - "외부 IP 대상 ICMP Ping/Traceroute"
            - "네트워크 설정 변경"
            - "서비스 재시작"
        report_design:
          formats:
            - "JSON"
            - "Markdown"
          categories:
            - "CPU"
            - "Memory"
            - "Network"
            - "Load"
          fields:
            - "check_id"
            - "category"
            - "target"
            - "status"
            - "evidence"
            - "sanitized_output"
            - "recommendation"
        tasks:
          - id: task-1
            title: "서버 상태 모니터링 Tool 구현"
            problem: "CPU, 메모리, 네트워크 연결 상태를 안전하게 수집하고 분석하는 로직이 필요합니다."
            solution: "psutil을 사용하여 시스템 메트릭을 수집하고, 수집된 데이터를 정의된 임계치와 비교하여 PASS/WARNING/FAIL 상태를 판별하는 BaseTool을 구현합니다."
            expected_effect: "서버의 전반적인 건강 상태를 한눈에 파악하고 잠재적인 리소스 병목 지점을 빠르게 식별할 수 있습니다."
            description: "psutil.cpu_percent(), psutil.virtual_memory(), psutil.net_connections()를 사용하고 CPU 80% 이상, 메모리 90% 이상 같은 임계치 기준으로 상태를 판정합니다."
            target_files:
              - "/custom-tools/5/server_health_monitor_tool.py"
          - id: task-1-1
            parent_id: task-1
            title: "메트릭 수집 로직 구현"
            problem: "시스템 자원과 네트워크 연결 수를 신뢰할 수 있는 방식으로 수집해야 합니다."
            solution: "전체 CPU 사용률, 코어별 CPU 사용률, 메모리 사용률, 가용 메모리, ESTABLISHED 네트워크 연결 수를 내부 메서드로 수집합니다."
            expected_effect: "리포트 생성에 필요한 기초 데이터를 안정적으로 확보합니다."
            target_files:
              - "/custom-tools/5/server_health_monitor_tool.py"
          - id: task-1-2
            parent_id: task-1
            title: "상태 분석 및 리포트 생성"
            problem: "수집된 숫자를 사용자가 바로 이해할 수 있는 진단 결과로 바꾸는 기준이 필요합니다."
            solution: "PASS, WARNING, FAIL, SKIPPED, INFO 상태를 부여하고 특정 프로세스의 메모리 점유율 증가 같은 원인 후보와 권장 조치를 JSON/Markdown 리포트로 제공합니다."
            expected_effect: "사용자가 CPU 과부하, 메모리 부족, 네트워크 연결 급증 같은 징후를 즉시 파악할 수 있습니다."
            target_files:
              - "/custom-tools/5/server_health_monitor_tool.py"
          - id: task-2
            title: "Tool 메타데이터 설정"
            problem: "Theseus 엔진이 Tool을 인식하고 입력/출력 계약을 표시하려면 메타데이터가 필요합니다."
            solution: "toolName, displayName, permissionLevel, inputs, outputs를 담은 meta.json을 작성합니다."
            expected_effect: "Tool 인터페이스가 명확해지고 재사용 가능한 시연/운영 기준이 생깁니다."
            target_files:
              - "/custom-tools/5/server_health_monitor_tool.meta.json"
        plan_b:
          title: "Remote Workspace 전용 어댑터 활용"
          reason: "커스텀 Tool의 보안 제약으로 실제 외부 네트워크 ping 테스트나 정밀 패킷 캡처를 수행할 수 없습니다."
          tradeoff: "커스텀 Tool 내부에서 모든 것을 처리하는 대신 기존 remote_check_* Tool을 context.call_tool로 호출해 보안성과 정확성을 확보합니다."
          condition: "단순 메트릭 수집을 넘어 실제 외부 연결성 테스트가 반드시 필요한 경우 적용합니다."
        caveats:
          - "psutil 의존성이 필요하며 /proc 접근 권한에 따라 일부 수집값은 SKIPPED가 될 수 있습니다."
          - "외부 IP ping, traceroute, 부하 생성, 네트워크 설정 변경, 서비스 재시작은 MVP 범위에서 제외합니다."
          - "정밀 외부 연결성 검사가 꼭 필요하면 Remote Workspace 전용 read-only adapter 또는 기존 remote_check_* Tool 조합을 Plan B로 사용합니다."
        verification:
          success_criteria:
            - "CPU, 메모리, 네트워크 연결 상태가 포함된 JSON/Markdown 리포트가 에러 없이 생성됩니다."
            - "threshold_cpu와 threshold_mem 값을 조정했을 때 WARNING/FAIL 판정이 정상적으로 바뀝니다."
            - "subprocess, socket 등 금지된 모듈을 import하지 않습니다."
          test_commands:
            - "python3 -B -m py_compile /custom-tools/5/server_health_monitor_tool.py"
          manual_checks:
            - "Tool 실행 결과의 CPU, 메모리 수치가 현재 시스템 상태와 크게 어긋나지 않는지 확인합니다."
            - "리소스 사용량이 높은 환경에서 WARNING 또는 FAIL 리포트가 출력되는지 확인합니다."
            - "코드 검토로 shell 실행과 네트워크 설정 변경 로직이 없는지 확인합니다."
      planSnapshot:
        schemaVersion: "1.0"
        planVersion: 1
        blocks:
          - blockId: overview
            title: "개요"
            content: "서버의 CPU, 메모리, 네트워크 상태를 한 번에 확인하고 이상 징후를 PASS/WARNING/FAIL/SKIPPED/INFO 상태로 리포트하는 읽기 전용 시스템 진단 Tool을 생성합니다."
            order: 1
          - blockId: problem-analysis
            title: "문제 분석"
            content: "현재 통합 진단 Tool이 없어 네트워크, 메모리, 부하 상태를 개별 원격 체크 Tool로 나누어 확인해야 하며, 발표 시에는 하나의 리포트 흐름으로 보여줄 필요가 있습니다."
            order: 2
          - blockId: task-1
            title: "서버 상태 모니터링 Tool 구현"
            content: "ServerHealthMonitorTool을 구현하고 psutil.cpu_percent(), psutil.virtual_memory(), psutil.net_connections()로 CPU, 메모리, 네트워크 연결 상태를 안전하게 수집합니다."
            order: 3
          - blockId: task-1-1
            title: "메트릭 수집 로직 구현"
            content: "전체/코어별 CPU 사용률, 메모리 사용률과 가용 메모리, ESTABLISHED 네트워크 연결 수를 수집합니다."
            order: 4
          - blockId: task-1-2
            title: "상태 분석 및 리포트 생성"
            content: "수집값을 threshold_cpu, threshold_mem 기준과 비교해 상태를 판정하고 원인 후보, 판정 근거, 권장 조치를 포함한 JSON/Markdown 리포트를 생성합니다."
            order: 5
          - blockId: task-2
            title: "Tool 메타데이터 설정"
            content: "server_health_monitor Tool의 입력값, 출력 필드, 권한 레벨 1, core_sandbox_gate 검증 전략을 meta.json에 정의합니다."
            order: 6
          - blockId: plan-b
            title: "대안 / Plan B"
            content: "외부 연결성 테스트가 반드시 필요하면 보안 제약이 있는 커스텀 Tool 내부에서 처리하지 않고 기존 remote_check_* Tool을 context.call_tool로 호출하는 전용 어댑터 방식을 사용합니다."
            order: 7
          - blockId: verification
            title: "검증 기준"
            content: "JSON/Markdown 리포트 생성, CPU/메모리 수치 확인, WARNING/FAIL 판정 확인, subprocess 등 금지 모듈 미사용 여부를 확인합니다."
            order: 8

