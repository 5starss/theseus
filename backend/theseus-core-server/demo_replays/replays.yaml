  - id: "2-server-health-monitor-tool-plan"
    modes: [PLAN]
    match:
      remote: none
      contains_any:
        - "서버 상태 모니터링 툴"
        - "서버 상태 통합 진단 툴"
        - "서버 헬스 모니터"
        - "CPU 메모리 네트워크 리포트"
        - "server_health_monitor"
    progress:
      - message: REQUEST_RECEIVED
        progressRate: 5
        delayMs: 300
      - message: PLAN_DRAFTING
        progressRate: 35
        delayMs: 900
      - message: PLAN_STRUCTURING
        progressRate: 75
        delayMs: 650
      - message: PLAN_VALIDATING
        progressRate: 90
        delayMs: 500
      - message: PLAN_COMPLETED
        progressRate: 100
        delayMs: 450
    result:
      rawMarkdown: |
        ## 서버 상태 통합 진단 Tool 생성 PLAN

        서버의 CPU, 메모리, 네트워크 상태를 모니터링하고 이상 징후를 리포트하는
        시스템 진단 Tool을 생성합니다.

        네트워크, 메모리, 부하 상태를 한 번에 확인하고 분석하여 리포트 형태로 제공하는
        자동화된 도구가 필요합니다. 단, 보안 정책상 shell 실행 및 특정 네트워크 모듈 사용이
        제한되므로 `psutil` 기반의 읽기 전용 메트릭 수집과 임계치 분석에 집중합니다.

        현재 서버 모니터링을 위한 통합 진단 Tool은 부재하고, 개별적인 원격 체크 Tool만
        존재하는 상태입니다. 따라서 서버 상태를 한눈에 파악할 수 있는 통합 리포트 흐름이 필요합니다.

        ### 주요 작업
        1. **서버 상태 모니터링 Tool 구현**
           - 문제: CPU, 메모리, 네트워크 연결 상태를 안전하게 수집하고 분석하는 로직이 필요합니다.
           - 해결 방향: `psutil`로 시스템 메트릭을 수집하고, 정의된 임계치와 비교하여 `PASS`, `WARNING`, `FAIL` 상태를 판별하는 `BaseTool`을 구현합니다.
           - 구현 내용: `ServerHealthMonitorTool` 클래스를 구현하고 `psutil.cpu_percent()`, `psutil.virtual_memory()`, `psutil.net_connections()`를 사용해 데이터를 수집합니다. CPU 80% 이상, 메모리 90% 이상 같은 임계치를 적용하여 리포트를 생성합니다.
           - 기대 효과: 서버의 전반적인 건강 상태를 한눈에 파악하고 잠재적인 리소스 병목 지점을 빠르게 식별할 수 있습니다.
           - 영향 파일: `/custom-tools/5/server_health_monitor_tool.py`

        2. **메트릭 수집 로직 구현**
           - 문제: 시스템 자원 및 네트워크 연결 수를 정밀하게 수집해야 합니다.
           - 해결 방향: 전체/코어별 CPU 사용률, 가용 메모리, 현재 활성화된 네트워크 연결 수(`ESTABLISHED` 상태 등)를 수집하는 내부 메서드를 구현합니다.
           - 기대 효과: 신뢰할 수 있는 시스템 메트릭 데이터를 확보합니다.
           - 영향 파일: `/custom-tools/5/server_health_monitor_tool.py`

        3. **상태 분석 및 리포트 생성 로직 구현**
           - 문제: 수집된 데이터를 기반으로 한 직관적인 판단 기준과 리포트 형식이 필요합니다.
           - 해결 방향: 수집된 메트릭을 기반으로 정상, 주의, 위험 단계를 구분하고, 문제가 있는 경우 원인 후보와 권장 조치를 함께 제공합니다.
           - 기대 효과: 사용자가 즉각적으로 조치 가능한 진단 결과를 받을 수 있습니다.
           - 영향 파일: `/custom-tools/5/server_health_monitor_tool.py`

        4. **Tool 메타데이터 설정**
           - 문제: Theseus 엔진이 Tool을 인식하고 실행할 수 있도록 메타데이터 정의가 필요합니다.
           - 해결 방향: `toolName`, `displayName`, `inputs`, `outputs`, 권한 레벨이 정의된 meta.json 파일을 생성합니다.
           - 기대 효과: Tool의 입력 파라미터와 출력 형식이 명확해져 일관된 인터페이스를 제공합니다.
           - 영향 파일: `/custom-tools/5/server_health_monitor_tool.meta.json`

        ### 주의 사항
        - `psutil` 라이브러리 의존성이 필요합니다.
        - `/proc` 파일 시스템 접근 권한에 따라 일부 정보 수집이 제한될 수 있습니다.

        ### 대안 / Plan B
        - **Remote Workspace 전용 어댑터 활용**
        - 커스텀 Tool의 보안 제약으로 인해 실제 외부 네트워크 ping, traceroute, 정밀 패킷 캡처는 수행하지 않습니다.
        - 단순 메트릭 수집을 넘어 외부 연결성 검사가 반드시 필요한 경우 기존 `remote_check_*` Tool을 `context.call_tool`로 호출하여 보안성과 정확성을 함께 확보합니다.

        ### 실행 스펙
        - 도구 이름: `server_health_monitor`
        - 권한 레벨: 1, 시스템 상태만 읽는 안전한 진단 도구
        - 검증 전략: `core_sandbox_gate`
        - 상태값: `PASS`, `WARNING`, `FAIL`, `SKIPPED`, `INFO`
        - 입력값: `threshold_cpu`, `threshold_mem`
        - MVP 제외: 인위적인 부하 생성, 외부 IP 대상 ICMP Ping/Traceroute, 네트워크 설정 변경, 서비스 재시작
        - 결과 필드: `check_id`, `category`, `target`, `status`, `evidence`, `sanitized_output`, `recommendation`

        ### 검증 기준
        - 네트워크, 메모리, 부하 상태가 포함된 JSON/Markdown 리포트가 에러 없이 생성되어야 합니다.
        - Tool 실행 시 CPU, 메모리 수치가 현재 시스템 상태와 일치하는지 확인합니다.
        - 리소스 사용량이 높은 환경에서 `WARNING` 또는 `FAIL` 상태가 정상적으로 출력되는지 확인합니다.
        - `subprocess` 등 금지된 모듈이 import되지 않았는지 코드 검토로 확인합니다.

