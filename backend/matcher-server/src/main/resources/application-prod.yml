server:
  port: 8082

spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: matcher-group
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

logging:
  level:
    root: info
    com.s14p21a503.matcher: debug

matcher:
  worker-id: ${MATCHER_WORKER_ID:0} # 분산 환경을 고려한 워커 id 설정
  participation-rate: ${MATCHER_PARTICIPATION_RATE:0.05} # 시장 거래량 대비 서비스 체결 참여율
  journal:
    dir: ${MATCHER_JOURNAL_DIR:/var/lib/matcher-data} # 저널 및 스냅샷 저장 경로
    batch-delay-ms: ${MATCHER_JOURNAL_BATCH_DELAY:5}
    max-batch-size: ${MATCHER_JOURNAL_MAX_BATCH_SIZE:1000}
  snapshot:
    retention: ${MATCHER_SNAPSHOT_RETENTION:3} # 보관할 스냅샷 개수
