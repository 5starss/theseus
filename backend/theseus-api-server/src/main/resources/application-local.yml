server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import:
      - optional:file:./.env.local[.properties]
      - optional:file:../../infra/docker/local/.env.local[.properties]
  application:
    name: theseus-api-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:13306/theseus}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:16379}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        highlight_sql: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:theseus-api-tool-generation}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.theseus.api.domain.toolgeneration.event,java.util,java.lang,com.fasterxml.jackson.databind
        spring.json.value.default.type: com.theseus.api.domain.toolgeneration.event.ToolGenerationEvent
        spring.json.use.type.headers: false

theseus:
  kafka:
    topics:
      tool-plan-request: ${KAFKA_TOPIC_TOOL_PLAN_REQUEST:theseus.tool-plan.request}
      tool-plan-event: ${KAFKA_TOPIC_TOOL_PLAN_EVENT:theseus.tool-plan.event}
      tool-build-request: ${KAFKA_TOPIC_TOOL_BUILD_REQUEST:theseus.tool-build.request}
      tool-generation-request: ${KAFKA_TOPIC_TOOL_GENERATION_REQUEST:theseus.tool-generation.request}
      tool-regeneration-request: ${KAFKA_TOPIC_TOOL_REGENERATION_REQUEST:theseus.tool-regeneration.request}
      tool-generation-event: ${KAFKA_TOPIC_TOOL_GENERATION_EVENT:theseus.tool-generation.event}
  tool-generation:
    state-ttl-minutes: ${THESEUS_TOOL_GENERATION_STATE_TTL_MINUTES:30}
    sse-timeout-millis: ${THESEUS_TOOL_GENERATION_SSE_TIMEOUT_MILLIS:1800000}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:theseus-local-development-jwt-secret-key-must-be-changed}
  access-token-expiration-millis: ${JWT_ACCESS_TOKEN_EXPIRATION_MILLIS:3600000}
  refresh-token-expiration-millis: ${JWT_REFRESH_TOKEN_EXPIRATION_MILLIS:1209600000}
  refresh-token-cookie-name: ${JWT_REFRESH_TOKEN_COOKIE_NAME:refresh_token}
  refresh-token-cookie-path: ${JWT_REFRESH_TOKEN_COOKIE_PATH:/api/v1/auth}
  refresh-token-cookie-secure: ${JWT_REFRESH_TOKEN_COOKIE_SECURE:false}
  refresh-token-cookie-same-site: ${JWT_REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}

internal:
  api-key: ${INTERNAL_API_KEY:theseus-local-internal-api-key}
