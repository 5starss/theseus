server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import:
      - optional:file:./.env.local[.properties]
      - optional:file:../../infra/docker/local/.env.local[.properties]
  application:
    name: theseus-api-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:13306/theseus}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        highlight_sql: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html
