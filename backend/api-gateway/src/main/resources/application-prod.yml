server:
  port: 8080

spring:
  application:
    name: api-gateway
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:5173}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

springdoc:
  swagger-ui:
    persist-authorization: true 
    urls:
      - name: core-api
        url: /v3/api-docs/core-api
      - name: market
        url: /v3/api-docs/market
      - name: ai-api
        url: /v3/api-docs/ai

jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:keys/public_key.pem}
  whitelist:
    - /api/v1/core/auth/signup
    - /api/v1/core/auth/login
    - /api/v1/core/auth/refresh
    - /api/v1/market/stocks
    - /api/v1/market/stocks/*
    - /api/v1/market/stocks/*/candles
    - /api/v1/market/stocks/search
    - /ws/v1/stocks
    - /swagger-ui.html
    - /swagger-ui/**
    - /v3/api-docs/**

service:
  core:
    url: http://core-api-server:8081
    api-docs-url: http://core-api-server:8081
  market:
    url: http://market-server:8085
    ws-url: ws://market-server:8085
    api-docs-url: http://market-server:8085
  ai:
    url: http://ai-server:8086 
    api-docs-url: http://ai-server:8086
