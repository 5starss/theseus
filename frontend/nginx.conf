# Nginx 버전 숨기기 (보안)
server_tokens off;

# Docker 내부 DNS 리졸버 (도커 네트워크 내 컨테이너 이름 매핑용)
resolver 127.0.0.11 valid=30s ipv6=off;

# 웹소켓 통신을 위한 헤더 매핑
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# API 게이트웨이 Upstream
upstream api_gateway_upstream {
    zone api_gateway_upstream 64k;
    server api-gateway:8080 resolve;
    keepalive 32;
}

# 1. HTTP (80) 서버 설정
server {
    listen 80;
    listen [::]:80;
    server_name ssafy-stock.kr;

    # Let's Encrypt 인증용 라우팅
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # 그 외 모든 요청은 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS (443) 서버 설정
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ssafy-stock.kr;

    # 인증서 경로
    ssl_certificate /etc/letsencrypt/live/ssafy-stock.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssafy-stock.kr/privkey.pem;

    # SSL/TLS 보안 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Jenkins 리다이렉트 및 프록시 설정
#    location = /jenkins {
#        return 301 /jenkins/;
#    }

#    location /jenkins/ {
#        proxy_http_version 1.1;

#        proxy_set_header Host $host;
#        proxy_set_header X-Real-IP $remote_addr;
#        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#        proxy_set_header X-Forwarded-Proto $scheme;
#        proxy_set_header X-Forwarded-Host $host;
#        proxy_set_header X-Forwarded-Port 443;
#        proxy_set_header Connection "";

#        proxy_buffering off;
#        proxy_request_buffering off;
#        client_max_body_size 50M;

#        proxy_pass http://jenkins:8080;
#    }

    # API 게이트웨이 프록시 설정
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_pass http://api_gateway_upstream;
    }

    # SSE(Server-Sent Events) 알림용 프록시 설정
    location /api/v1/core/notifications/ {
        proxy_pass http://api_gateway_upstream;

        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Upgrade "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        chunked_transfer_encoding on;
    }

    # 웹소켓 프록시 설정
    location /ws/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_pass http://api_gateway_upstream;
    }

    # 정적 에셋(이미지, CSS, JS 등) 캐싱 처리
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 프론트엔드(SPA) 라우팅 처리
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}