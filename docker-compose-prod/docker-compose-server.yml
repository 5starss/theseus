services:
  api-gateway:
    build:
      context: ../backend/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - stock-network

  core-api-server:
    build:
      context: ../backend/core-api-server
      dockerfile: Dockerfile
    container_name: core-api-server
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8081"
    networks:
      - stock-network

  market-server:
    build:
      context: ../backend/market-server
      dockerfile: Dockerfile
    container_name: market-server
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8085"
    networks:
      - stock-network

  ai-server:
    build:
      context: ../backend/ai-server
      dockerfile: Dockerfile
    container_name: ai-server
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8086"
    networks:
      - stock-network

networks:
  stock-network:
    external: true
    name: stock-network

volumes:
  kafka_data: